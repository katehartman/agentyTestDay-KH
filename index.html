<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greyscale Checkboxes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 32px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #333;
      transition: background-color 0.15s ease;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
    }

    .readout {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    .controls button {
      font-size: 1rem;
      padding: 8px 16px;
      border: 1px solid rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.7);
      color: #333;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.1s ease;
    }

    .controls button:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.9);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      max-width: 480px;
      width: 100%;
    }

    label {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      border: 1px solid rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.1s ease;
    }

    label:hover {
      transform: scale(1.05);
    }

    label.checked {
      background: rgba(0, 0, 0, 0.1);
    }

    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #555;
    }
  </style>
</head>
<body>
  <h1>Greyscale Checkboxes</h1>
  <div class="readout" id="readout">0/25 checked — rgb(0, 0, 0)</div>
  <div class="controls">
    <button id="toggle-all">Toggle All</button>
    <button id="clear-all">Clear All</button>
  </div>
  <div class="grid" id="grid"></div>

  <script>
    const TOTAL = 25;
    const grid = document.getElementById('grid');
    const readout = document.getElementById('readout');
    const toggleAll = document.getElementById('toggle-all');
    const clearAll = document.getElementById('clear-all');

    for (let i = 0; i < TOTAL; i++) {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.addEventListener('change', update);
      label.appendChild(input);
      grid.appendChild(label);
    }

    function update() {
      const count = document.querySelectorAll('input[type="checkbox"]:checked').length;
      const value = Math.round((count / TOTAL) * 255);
      document.body.style.backgroundColor = `rgb(${value}, ${value}, ${value})`;
      readout.textContent = `${count}/${TOTAL} checked — rgb(${value}, ${value}, ${value})`;
    }

    toggleAll.addEventListener('click', () => {
      const inputs = document.querySelectorAll('input[type="checkbox"]');
      const allChecked = [...inputs].every(i => i.checked);
      inputs.forEach(i => { i.checked = !allChecked; });
      update();
    });

    clearAll.addEventListener('click', () => {
      document.querySelectorAll('input[type="checkbox"]').forEach(i => { i.checked = false; });
      update();
    });

    update();
  </script>
</body>
</html>
